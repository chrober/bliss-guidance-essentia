name: Native Essentia Guidance SPI v2 shadow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test real SPI v2 types, exact artifact, read-only SQLite, neutral safety
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets --verbose
      - name: Assert formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
